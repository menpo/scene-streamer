name: CI
on:
  push: { branches: [master] }
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uvx ruff check .
      - run: uvx ruff format --check .

  test:
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.10", "3.14"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }   # setuptools-scm needs tags
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --python ${{ matrix.python }} --group dev
      - run: uv run pytest -q -rs

  minimal:
    # no extras at all: the hub, JPEG frames, and the clear errors for what is missing
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: astral-sh/setup-uv@v5
      - run: |
          uv venv .venv-min
          uv pip install --python .venv-min . pytest
          .venv-min/bin/python -m pytest -q -rs

  sdist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: astral-sh/setup-uv@v5
      - run: uv build --sdist
      - name: Unpack the sdist (no git) and run its tests against it
        run: |
          mkdir unpacked && tar -xzf dist/*.tar.gz -C unpacked
          cd unpacked/scene_streamer-*
          uv venv .venv
          uv pip install --python .venv . pytest anywidget
          rm -rf scene_streamer   # test the installed copy, not the source folder
          .venv/bin/python -m pytest -q -rs

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: astral-sh/setup-uv@v5
      - name: Only one Read the Docs config (it prefers a legacy readthedocs.yml over .readthedocs.yaml)
        run: |
          if ls readthedocs.yml readthedocs.yaml .readthedocs.yml 2>/dev/null; then
            echo "legacy Read the Docs config file(s) above must be removed"; exit 1
          fi
      - name: Validate the Read the Docs configuration against its schema
        run: uvx check-jsonschema --builtin-schema vendor.readthedocs .readthedocs.yaml
      - name: Install what Read the Docs installs
        run: |
          uv venv --python 3.13 .venv-docs
          uv pip install --python .venv-docs -r docs/requirements.txt ".[notebook]"
      - name: Build the docs (warnings are errors, as on Read the Docs)
        run: .venv-docs/bin/python -m sphinx -W --keep-going -b html docs/source docs/_build
